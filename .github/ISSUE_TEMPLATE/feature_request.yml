name: 功能建议
description: 提议改进现有支持范围、交互或维护流程。
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前用户场景和困难，不要只写功能名称。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明预期交互、失败处理和用户控制。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明目前如何解决，以及为什么不够。

  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 我已说明是否需要新增网站权限、网络服务或自动提交/点击行为。
          required: true
        - label: 建议中不包含绕过学校规则、无限重试或隐藏用户无法停止的自动化。
          required: true
