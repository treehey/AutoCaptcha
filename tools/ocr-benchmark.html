<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>NJU OCR Benchmark</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 24px;
      color: #202124;
      background: #f7f8fb;
    }
    h1 { font-size: 20px; margin: 0 0 12px; }
    #summary {
      white-space: pre-wrap;
      background: #fff;
      border: 1px solid #d8dce6;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 16px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      background: #fff;
      border: 1px solid #d8dce6;
      border-radius: 8px;
      overflow: hidden;
    }
    th, td {
      border-bottom: 1px solid #eef0f5;
      padding: 8px;
      text-align: left;
      font-size: 13px;
    }
    th { background: #f0f2f8; }
    tr.ok td:first-child { color: #137333; font-weight: 700; }
    tr.err td:first-child { color: #b3261e; font-weight: 700; }
    img { width: 120px; height: 40px; image-rendering: pixelated; }
    code { font-family: Consolas, monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>NJU OCR Benchmark</h1>
  <div id="summary">Initializing...</div>
  <table>
    <thead>
      <tr>
        <th>状态</th>
        <th>ID</th>
        <th>图片</th>
        <th>正确</th>
        <th>识别</th>
        <th>耗时</th>
        <th>Fallback</th>
        <th>候选</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script>
    window.chrome = {
      runtime: {
        getManifest: () => ({ version: 'benchmark' }),
        getURL: resource => new URL('/' + String(resource).replace(/^\/+/, ''), location.origin).href
      },
      storage: {
        local: {
          get: async () => ({ nju_enabled: false })
        }
      }
    };
  </script>
  <script src="/tesseract.min.js"></script>
  <script src="/content.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const sampleDir = params.get('sample') || 'data/captcha-samples/round-001';
    const summaryEl = document.getElementById('summary');
    const rowsEl = document.getElementById('rows');

    function parseCsv(text) {
      return text.trim().split(/\r?\n/).slice(1)
        .map(line => line.split(',').map(part => part.trim()))
        .filter(parts => parts.length >= 3 && parts[2])
        .map(([id, file, answer]) => ({ id, file, answer }));
    }

    function average(values) {
      return values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
    }

    function percentile(values, p) {
      if (!values.length) return 0;
      const sorted = [...values].sort((a, b) => a - b);
      const idx = Math.min(sorted.length - 1, Math.max(0, Math.ceil((p / 100) * sorted.length) - 1));
      return sorted[idx];
    }

    function sameCaptchaAnswer(actual, expected) {
      if (!actual || !expected || actual.length !== expected.length) return false;
      for (let i = 0; i < expected.length; i++) {
        const a = actual[i];
        const b = expected[i];
        if (/[a-zA-Z]/.test(a) && /[a-zA-Z]/.test(b)) {
          if (a.toLowerCase() !== b.toLowerCase()) return false;
        } else if (a !== b) {
          return false;
        }
      }
      return true;
    }

    function addRow(result) {
      const tr = document.createElement('tr');
      tr.className = result.ok ? 'ok' : 'err';
      const candidateText = result.candidates
        .map(item => `${item.variant}=${item.code || '空'}(${item.confidence})`)
        .join(' | ');
      tr.innerHTML = `
        <td>${result.ok ? 'OK' : 'ERR'}</td>
        <td>${result.id}</td>
        <td><img src="/${sampleDir}/${result.file}" alt="${result.id}"></td>
        <td><code>${result.answer}</code></td>
        <td><code>${result.code || ''}</code></td>
        <td>${Math.round(result.elapsedMs)}ms</td>
        <td>${result.usedFallback ? 'yes' : 'no'}</td>
        <td><code>${candidateText}</code></td>
      `;
      rowsEl.appendChild(tr);
    }

    async function runOne(sample) {
      const img = new Image();
      img.src = `/${sampleDir}/${sample.file}`;
      await img.decode();

      const started = performance.now();
      const base = await readCaptchaBitmap(img);
      const engine = await getCaptchaWorker();
      let candidates = await recognizeCaptchaVariants(engine, base, getFastCaptchaVariants());
      let selected = selectCaptchaCode(candidates);
      let usedFallback = false;

      if (shouldRunFallbackVariants(candidates, selected)) {
        const fallback = await recognizeCaptchaVariants(engine, base, getFallbackCaptchaVariants());
        candidates = candidates.concat(fallback);
        selected = selectCaptchaCode(candidates);
        usedFallback = true;
      }

      const code = selected ? correctVisualConfusions(selected, base, candidates) : '';
      return {
        ...sample,
        selected,
        code,
        elapsedMs: performance.now() - started,
        usedFallback,
        ok: sameCaptchaAnswer(code, sample.answer),
        candidates: candidates.map(item => ({
          variant: item.variant,
          code: item.code || '',
          confidence: Math.round(item.confidence || 0)
        }))
      };
    }

    async function main() {
      const answers = parseCsv(await fetch(`/${sampleDir}/answers.csv`, { cache: 'no-store' }).then(r => r.text()));
      const results = [];
      summaryEl.textContent = `Loaded ${answers.length} samples from ${sampleDir}. Running...`;

      for (const sample of answers) {
        const result = await runOne(sample);
        results.push(result);
        addRow(result);
        const ok = results.filter(item => item.ok).length;
        summaryEl.textContent = `Running ${results.length}/${answers.length}\nAccuracy so far: ${ok}/${results.length}`;
      }

      const correct = results.filter(item => item.ok).length;
      const times = results.map(item => item.elapsedMs);
      const warmTimes = times.slice(1);
      window.benchmarkResults = {
        sampleDir,
        correct,
        total: results.length,
        accuracy: correct / results.length,
        avgMs: average(times),
        warmAvgMs: average(warmTimes),
        p50Ms: percentile(times, 50),
        p95Ms: percentile(times, 95),
        fallbackCount: results.filter(item => item.usedFallback).length,
        errors: results.filter(item => !item.ok),
        results
      };
      window.benchmarkDone = true;
      summaryEl.textContent =
        `Accuracy: ${correct}/${results.length} (${(correct / results.length * 100).toFixed(1)}%)\n` +
        `Avg OCR: ${average(times).toFixed(0)}ms\n` +
        `Warm avg OCR: ${average(warmTimes).toFixed(0)}ms\n` +
        `P50/P95 OCR: ${percentile(times, 50).toFixed(0)}ms / ${percentile(times, 95).toFixed(0)}ms\n` +
        `Fallback used: ${window.benchmarkResults.fallbackCount}/${results.length}`;
    }

    main().catch(err => {
      window.benchmarkDone = true;
      window.benchmarkError = String(err && err.stack || err);
      summaryEl.textContent = window.benchmarkError;
      console.error(err);
    });
  </script>
</body>
</html>
